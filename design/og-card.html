<!doctype html>
<!-- Source of public/og-card.png (the link preview image). Re-render with design/render-og.sh. -->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@500;700&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: "Noto Sans Arabic", sans-serif; color: #fff; position: relative;
    background:
      radial-gradient(60% 90% at 18% 20%, rgba(141,184,242,.55) 0%, transparent 55%),
      radial-gradient(45% 70% at 30% 85%, rgba(47,111,176,.6) 0%, transparent 60%),
      radial-gradient(70% 90% at 95% 10%, #12386B 0%, transparent 60%),
      linear-gradient(160deg, #0A2F5C 0%, #071A33 55%, #050A16 100%); }
  /* metallic folds */
  .folds { position: absolute; inset: -20%; opacity: .55; filter: blur(18px);
    background: repeating-linear-gradient(115deg, transparent 0 60px, rgba(201,214,232,.18) 80px, transparent 120px 190px); }
  .wrap { position: absolute; inset: 0; padding: 64px 72px; display: flex; flex-direction: column; justify-content: space-between; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .mark { width: 92px; height: 80px; background: #fff; -webkit-mask: url(../public/logo-e.png) center / contain no-repeat; }
  .badge { font-family: Inter, sans-serif; font-weight: 700; font-size: 18px; letter-spacing: .18em; color: #C9D6E8;
    border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 10px 20px; background: rgba(255,255,255,.06); direction: ltr; }
  h1 { margin: 0; font-size: 104px; line-height: 1.05; font-weight: 700;
    background: linear-gradient(100deg, #fff 0%, #C9D6E8 35%, #fff 55%, #8DB8F2 100%); -webkit-background-clip: text; color: transparent; padding-bottom: 30px; margin-bottom: -6px; }
  .en { font-family: Inter, sans-serif; font-size: 36px; font-weight: 700; color: #fff; direction: ltr; text-align: right; margin-top: 4px; }
  .role { font-size: 32px; font-weight: 700; color: #8DB8F2; margin-top: 10px; }
  .facts { display: flex; gap: 14px; }
  .fact { border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08); border-radius: 20px; padding: 14px 22px; }
  .fact b { display: block; font-family: Inter, sans-serif; font-size: 30px; direction: ltr; text-align: right; }
  .fact span { font-size: 17px; color: #C9D6E8; }
  .url { font-family: Inter, sans-serif; font-size: 22px; font-weight: 500; color: #C9D6E8; direction: ltr; align-self: flex-end; }
  .bottom { display: flex; justify-content: space-between; align-items: flex-end; }
</style>
</head>
<body>
<div class="folds"></div>
<div class="wrap">
  <div class="top"><div class="mark"></div><div class="badge">DATA SCIENCE · RESEARCH · AI</div></div>
  <div>
    <h1>عناد الروقي</h1>
    <div class="en">Enad Alrougi · AI Researcher &amp; Data Scientist</div>
    <div class="role">عالم بيانات وباحث في الذكاء الاصطناعي</div>
  </div>
  <div class="bottom">
    <div class="facts">
      <div class="fact"><b>2</b><span>ورقة علمية في IEEE</span></div>
      <div class="fact"><b>99.14%</b><span>دقة تطبيق كشف الزهايمر</span></div>
      <div class="fact"><b>16</b><span>مشروع مفتوح المصدر</span></div>
    </div>
    <div class="url">ide21.github.io</div>
  </div>
</div>
</body>
</html>
